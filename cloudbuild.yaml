# Cloud Build Configuration untuk moriesly-be
# Otomatis build, push ke Artifact Registry, dan deploy ke Cloud Run
# Environment variables di-set di Cloud Build Trigger

steps:
  # 1. Build Docker Image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:latest"
      - "."
    id: "build-moriesly-be"

  # 2. Push ke Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}"
    id: "push-moriesly-be"

  # 3. Deploy ke Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--memory=${_MEMORY}"
      - "--cpu=${_CPU}"
      - "--min-instances=${_MIN_INSTANCES}"
      - "--max-instances=${_MAX_INSTANCES}"
      - "--port=${_PORT}"
      - "--timeout=300"
      - "--cpu-boost"
      - "--cpu-throttling"
      # Environment Variables Runtime ke Container
      - "--set-env-vars=NODE_ENV=${_NODE_ENV}"
      - "--set-env-vars=PORT=${_PORT}"
      - "--set-env-vars=FRONTEND_URL=${_FRONTEND_URL}"
      - "--set-env-vars=GEMINI_API_KEY=${_GEMINI_API_KEY}"
      - "--set-env-vars=FIREBASE_WEB_API_KEY=${_FIREBASE_WEB_API_KEY}"
      - "--set-secrets=FIREBASE_SERVICE_ACCOUNT_JSON=FIREBASE_SERVICE_ACCOUNT_JSON:latest"
    id: "deploy-moriesly-be"

# Default Substitutions
substitutions:
  _SERVICE_NAME: "moriesly-be"
  _REGION: "us-central1"
  _ARTIFACT_REGISTRY_REPO: "moriesly-be"
  _MEMORY: "512Mi"
  _CPU: "1"
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "10"
  # Variabel di bawah harus diisi di Cloud Build Trigger Settings
  _NODE_ENV: "production"
  _PORT: "8080"
  _FRONTEND_URL: ""
  _GEMINI_API_KEY: ""
  _FIREBASE_WEB_API_KEY: ""
  _FIREBASE_SERVICE_ACCOUNT_JSON: ""

options:
  logging: CLOUD_LOGGING_ONLY

timeout: "1200s"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_SERVICE_NAME}:latest"
